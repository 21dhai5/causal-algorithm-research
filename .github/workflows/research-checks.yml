name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 外部 PR 只使用只读权限，不接触仓库密钥或真实数据。
permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 官方动作固定到查验过的提交，避免浮动标签被替换。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Run synthetic invariants and chronological experiment
        run: python -B experiments/run_synthetic.py --seed 7 --samples 400 --replications 3 --bootstrap-draws 100 --output "${{ runner.temp }}/synthetic-ci.json"
      - name: Plan causal-event storyboard without model credentials
        run: python -B experiments/run_storyboard.py --text "一个男孩踢了一下足球，足球滚向桌子并撞倒了桌上的水杯。" --output "${{ runner.temp }}/storyboard-example"
      - name: Verify storyboard coverage and offline provenance
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          # report 只读取本次 CI 离线生成的分镜，不访问凭据和真实数据。
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'storyboard-example/storyboard.json').read_text(encoding='utf-8'))
          # shots 是依次播放的镜头；故事事件的并行关系另存。
          shots = report['shots']
          assert len(shots) == 3
          assert shots[0]['start_s'] == 0 and shots[-1]['end_s'] == 6
          assert all(left['end_s'] == right['start_s'] and left['end_state'] == right['start_state'] for left, right in zip(shots, shots[1:]))
          assert shots[-1]['end_state']['cup.pose'] == 'tipped_on_table'
          assert all(shot['image']['path'] is None and shot['image']['status'] == 'not_requested' for shot in shots)
          assert report['generation_kind'] == 'STORYBOARD_STILL_IMAGES_NOT_CONTINUOUS_VIDEO'
          PY
      - name: Verify combat branches and causal playback
        run: |
          PYTHONPATH=src python -B - <<'PY'
          from causal_combat import build_combat
          # scenarios 用四类输入检验同一套规则，不把设计模拟当作实测标签。
          scenarios = {
              'hit': {'charge': 0.95, 'distance_m': 6, 'shield': 24},
              'blocked': {'charge': 0.55, 'shield': 120},
              'miss': {'aim_offset_m': 4},
              'insufficient_energy': {'charge': 0},
          }
          for kind, parameters in scenarios.items():
              # report 同时提供素材、事件与状态帧，回放必须从初态到同一终态。
              report = build_combat(**parameters)
              assert report['mode'] == 'RULE_BASED_DESIGN_SIMULATION'
              assert report['outcome']['kind'] == kind
              assert report['frames'][0]['t_s'] == 0
              assert report['frames'][0]['state']['attacker.energy'] == report['initial_state']['attacker.energy']
              assert report['frames'][-1]['state'] == report['final_state']
              assert report['frames'][-1]['t_s'] == report['duration_s']
              # contact 为实际接触时刻；未接触的帧禁止提前出现伤害与环境破坏。
              contact = report['outcome']['impact_time_s']
              for frame in report['frames']:
                  if contact is None or frame['t_s'] < contact:
                      assert frame['state']['defender.hp'] == 100
                      assert not frame['state']['ground.cracked']
                      assert frame['state']['camera.shake'] == 0
              if kind != 'hit':
                  assert report['final_state']['defender.hp'] == 100
                  assert not report['final_state']['ground.cracked']
          PY
