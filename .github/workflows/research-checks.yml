name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 外部 PR 只使用只读权限，不接触仓库密钥或真实数据。
permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 官方动作固定到查验过的提交，避免浮动标签被替换。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Run synthetic invariants and chronological experiment
        run: python -B experiments/run_synthetic.py --seed 7 --samples 400 --replications 3 --bootstrap-draws 100 --output "${{ runner.temp }}/synthetic-ci.json"
      - name: Plan causal-event storyboard without model credentials
        run: python -B experiments/run_storyboard.py --text "一个男孩踢了一下足球，足球滚向桌子并撞倒了桌上的水杯。" --output "${{ runner.temp }}/storyboard-example"
      - name: Verify storyboard coverage and offline provenance
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          # report 只读取本次 CI 离线生成的分镜，不访问凭据和真实数据。
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'storyboard-example/storyboard.json').read_text(encoding='utf-8'))
          # shots 是依次播放的镜头；故事事件的并行关系另存。
          shots = report['shots']
          assert len(shots) == 3
          assert shots[0]['start_s'] == 0 and shots[-1]['end_s'] == 6
          assert all(left['end_s'] == right['start_s'] and left['end_state'] == right['start_state'] for left, right in zip(shots, shots[1:]))
          assert shots[-1]['end_state']['cup.pose'] == 'tipped_on_table'
          assert all(shot['image']['path'] is None and shot['image']['status'] == 'not_requested' for shot in shots)
          assert report['generation_kind'] == 'STORYBOARD_STILL_IMAGES_NOT_CONTINUOUS_VIDEO'
          PY
      - name: Verify detailed VFX prompts and explicit references
        run: |
          PYTHONPATH=src python -B - <<'PY'
          from causal_combat import generate_prompt
          # details 中每处纸灰卷边均独立成项，不能因同名或数量合并。
          details = [{'id': f'ash{index}', 'name': '纸灰卷边', 'attributes': {'位置': f'原文位置{index}', '状态': '未燃烧'}} for index in range(64)]
          # interaction 仅是作者限定的描述，不模拟响应是否发生。
          interaction = {'id': 'r1', 'source_id': 'ash0', 'target_id': 'ash1', 'trigger': '如果前片遮住后片', 'response': '仅被遮区域不可见，尚未发生'}
          report = generate_prompt('保留两片的前后遮挡条件。', elements=details, interactions=[interaction])
          assert report['mode'] == 'PROMPT_ONLY'
          assert len(report['elements']) == len(details)
          assert 'frames' not in report and 'outcome' not in report
          for original, generated in zip(details, report['elements']):
              assert original['attributes'] == generated['attributes']
              assert original['id'] in generated['prompt']
              assert original['attributes']['位置'] in report['full_prompt']
          assert interaction['trigger'] == report['interactions'][0]['trigger']
          assert interaction['response'] in report['full_prompt']
          # prose 无法完整拆解时保留原文跨度，不能注入固定示例元素。
          prose = '雨丝掠过玉簪，窗纸尚未被打湿。'
          unresolved = generate_prompt(prose)
          assert unresolved['elements'] == []
          assert unresolved['extraction_status'] == 'needs_element_details'
          assert all(prose[item['start']:item['end']] == item['text'] for item in unresolved['unresolved_fragments'])
          # 循环父级须明确报错，不能生成无法解释的元素依赖。
          try:
              generate_prompt('', elements=[{'id': 'a', 'name': 'A', 'parent_id': 'b'}, {'id': 'b', 'name': 'B', 'parent_id': 'a'}])
          except ValueError:
              pass
          else:
              raise AssertionError('cyclic parents accepted')
          PY
